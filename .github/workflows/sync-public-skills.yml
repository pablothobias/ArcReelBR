name: Package public skills

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public-skills
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package skills from this revision
        run: |
          mkdir -p distribution/skills
          cp -R skills/setup-arcreel-skills skills/video-workflow distribution/skills/
          cp -R agent_runtime_profile/.claude/skills/adapt-custom-endpoint distribution/skills/
          cp skills/LICENSE distribution/LICENSE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arcreelbr-skills
          path: distribution/
          retention-days: 7
