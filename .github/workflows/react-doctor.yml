# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor

name: React Doctor

# Advisory scans run after main changes or by manual request, without PR checks or comments.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/react-doctor.yml"

permissions:
  contents: read
  statuses: write

# A newer run replaces an in-flight scan of the same branch.
concurrency:
  group: react-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      # Full history supports comparisons with earlier revisions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: millionco/react-doctor@695e46eee203a5d1855020191aa7e9c010a1250e # v2.4.0
        # Report branch health without PR notifications or a merge gate.
        with:
          directory: frontend
          # CI installs no dependencies; omitting version runs npm latest. Update this when upgrading react-doctor in frontend/package.json.
          version: "0.9.18"
          comment: false
          review-comments: false
