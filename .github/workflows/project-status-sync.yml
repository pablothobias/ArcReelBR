name: project-status-sync

# Sync the org Project board Status field, derived one-way from triage labels, assignee, linked PRs, and open/closed state.
# Issue events sync one issue; schedules and manual runs reconcile all. Rules live in scripts/project_status_sync.py.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, assigned, unassigned]
  schedule:
    - cron: "30 21 * * *" # 05:30 Beijing time, full reconciliation
  workflow_dispatch:

concurrency:
  # Full reconciliation shares one group; issue runs are serialized by issue number.
  group: project-status-sync-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'all' || format('issue-{0}', github.event.issue.number) }}
  cancel-in-progress: true

# The script uses PROJECT_STATUS_SYNC_TOKEN, not GITHUB_TOKEN.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs triggered by Dependabot cannot access repository Actions secrets.
    if: github.actor != 'dependabot[bot]'
    steps:
      # Use the default-branch script for issue synchronization and manual reconciliation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync project status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATUS_SYNC_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          case "$EVENT_NAME" in
            issues) python3 scripts/project_status_sync.py --issue "$ISSUE_NUMBER" ;;
            *) python3 scripts/project_status_sync.py --all ;;
          esac
