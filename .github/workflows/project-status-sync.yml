name: project-status-sync

# Sync the org Project board Status field, derived one-way from triage labels, assignee, linked PRs, and open/closed state.
# Manual runs reconcile all issues. Rules live in scripts/project_status_sync.py.
on:
  workflow_dispatch:

concurrency:
  # Serialize full reconciliations.
  group: project-status-sync-all
  cancel-in-progress: true

# The script uses PROJECT_STATUS_SYNC_TOKEN, not GITHUB_TOKEN.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs triggered by Dependabot cannot access repository Actions secrets.
    if: github.actor != 'dependabot[bot]'
    steps:
      # Use the default-branch script for manual reconciliation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Sync project status
        env:
          GH_TOKEN: ${{ secrets.PROJECT_STATUS_SYNC_TOKEN }}
        run: python3 scripts/project_status_sync.py --all
